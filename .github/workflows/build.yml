name: Build Release APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Setup Android & Fix Signing/SDK
        run: |
          # 1. Ensure Android platform exists
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --org com.example.mayajaal --project-name mayajaal
          fi

          # 2. Fix Min SDK Version to 21
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' $GRADLE_FILE
            sed -i 's/minSdk =.*/minSdk = 21/g' $GRADLE_FILE
            
            # Force release build to use debug signing config so it doesn't look for missing keystore
            sed -i '/buildTypes {/,/}/ { /release {/ { n; s/.*/        signingConfig signingConfigs.debug/ } }' $GRADLE_FILE
          fi

          # 3. Add Internet Permission to Manifest
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_FILE"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_FILE"
            fi
          fi

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
